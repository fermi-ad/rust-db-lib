name: Rust Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@ebd9660ad3eede933114ba1989b59d13aa5c4bf2
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  deploy-docs:
    needs: run-tests-and-coverage
    if: ${{ github.event_name == 'push' }}
    uses: fermi-ad/.github/.github/workflows/deploy-rust-docs.yaml@75e45bfe74331d410a0af9eb1af33fd8d1f1806a
    secrets: inherit 
    permissions:
      contents: write
      id-token: write
      pages: write
