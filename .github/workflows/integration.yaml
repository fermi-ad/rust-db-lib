name: Rust Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests-and-coverage:
    uses: fermi-ad/.github/.github/workflows/rust-integration.yaml@e0c90cb1aa154991276dbdd6a4eccfd676b5208b
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      references-internal-git-repo: true

  deploy-docs:
    needs: run-tests-and-coverage
    if: ${{ github.event_name == 'push' }}
    uses: fermi-ad/.github/.github/workflows/deploy-rust-docs.yaml@3e98f98790694d1694d754d1eae183ce745d342d
    secrets: inherit 
    permissions:
      contents: write
      id-token: write
      pages: write
    with:
      references-internal-git-repo: true
